checkpointing:
  mode: max
  monitor: val/accuracy
  save_top_k: 3
data:
  num_negatives: 7
  num_workers: 4
  test_paths:
  - /data/Yanlai/KGLLM/Data/webqsp_final/shortest_paths/test.parquet
  - /data/Yanlai/KGLLM/Data/CWQ/shortest_paths/test.parquet
  train_paths:
  - /data/Yanlai/KGLLM/Data/webqsp_final/shortest_paths/train.parquet
  - /data/Yanlai/KGLLM/Data/preprocessed_paths/webqsp_train.parquet
  - /data/Yanlai/KGLLM/Data/preprocessed_paths/webqsp_train_augmented.parquet
  - /data/Yanlai/KGLLM/Data/CWQ/shortest_paths/train.parquet
  - /data/Yanlai/KGLLM/Data/preprocessed_paths/cwq_train.parquet
  - /data/Yanlai/KGLLM/Data/preprocessed_paths/cwq_train_augmented.parquet
  - /data/Yanlai/KGLLM/Data/LLM_Rephrased_CWQ_WebQSP/webqsp_rephrased_train.parquet
  - /data/Yanlai/KGLLM/Data/LLM_Rephrased_CWQ_WebQSP/cwq_rephrased_train_part1.parquet
  - /data/Yanlai/KGLLM/Data/LLM_Rephrased_CWQ_WebQSP/cwq_rephrased_train_part2.parquet
  val_paths:
  - /data/Yanlai/KGLLM/Data/webqsp_final/shortest_paths/val.parquet
  - /data/Yanlai/KGLLM/Data/CWQ/shortest_paths/val.parquet
logging:
  experiment_name: entity_identifier_full
  log_every_n_steps: 100
  output_dir: outputs_entity_identifier
  val_check_interval: 0.25
model:
  embedding_size: 256
  encoder_name: BAAI/bge-small-en-v1.5
  freeze_encoder: false
  gliner_model: urchade/gliner_medium-v2.1
  hidden_size: 384
  max_seq_length: 128
  use_gliner: false
training:
  accumulate_grad_batches: 2
  batch_size: 64
  gradient_clip_val: 1.0
  learning_rate: 2.0e-05
  max_epochs: 5
  precision: 16-mixed
  temperature: 0.05
  warmup_steps: 1000
