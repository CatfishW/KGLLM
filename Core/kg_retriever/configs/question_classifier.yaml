# Question Classifier Configuration

# Model settings
model:
  encoder_name: "huawei-noah/TinyBERT_General_6L_768D"
  num_classes: 4  # one_hop, multi_hop, one_hop_numeric, multi_hop_numeric
  hidden_dim: 768
  dropout: 0.2  # Increased for better generalization
  freeze_encoder_layers: 0  # Set > 0 to freeze early layers

# Data settings
data:
  data_dir: "/data/Yanlai/KGLLM/Data/preprocessed_paths"
  max_length: 128
  max_hops: 5  # Filter outliers with paths > 5 hops
  include_augmented: true
  use_weighted_sampling: true

# Training settings
training:
  batch_size: 64
  num_workers: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  max_epochs: 10
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  early_stopping_patience: 3
  early_stopping_min_delta: 0.001

# Output settings
output:
  output_dir: "outputs_question_classifier"
  save_top_k: 3
  export_onnx: true

# Hardware settings
hardware:
  accelerator: "gpu"
  devices: 1
  precision: "16-mixed"  # Mixed precision for speed
