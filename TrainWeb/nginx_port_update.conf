server {
    listen 80;
    server_name game.agaii.org;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name game.agaii.org;
    
    include enable-php-80.conf;
    # SSL Certificate (aaPanel paths)
    ssl_certificate    /www/server/panel/vhost/cert/game.agaii.org/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/game.agaii.org/privkey.pem;
    
    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Logs (aaPanel paths)
    access_log  /www/wwwlogs/game.agaii.org.log;
    error_log  /www/wwwlogs/game.agaii.org.error.log;

    # WebGL Game (root)
    root /www/wwwroot/game.agaii.org;
    index index.html;
    # Player Data API - add this BEFORE location /
    location /v1/player-data {
        proxy_pass http://127.0.0.1:7999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Encoding $http_content_encoding;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirect without trailing slash
    location = /stt { return 301 /stt/; }
    location = /llm { return 301 /llm/; }
    location = /tts { return 301 /tts/; }

    # ============================================
    # STT - Whisper API (port 25567)
    # ============================================
    location /stt/ {
        proxy_pass https://127.0.0.1:25567/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
    }

    # ============================================
    # LLM API (port 25565)
    # ============================================
    location /llm/ {
        proxy_pass https://127.0.0.1:25565/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        client_max_body_size 10M;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    }
    location /mllm/ {
    proxy_pass http://127.0.0.1:8888/;
    proxy_http_version 1.1;
    proxy_ssl_verify off;

    # WebSocket support (if needed)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Forward original client info
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeout settings (increase for long-running LLM requests)
    proxy_connect_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    }

    # ============================================
    # TTS - Kokoro API (port 25566)
    # ============================================
    location /tts/ {
        proxy_pass https://127.0.0.1:25566/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        client_max_body_size 10M;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
    }
    location /tts2/ {
    # Proxy to local TTS server (via SSH tunnel on port 8888)
    proxy_pass http://127.0.0.1:9999/;

    # Properly strip /tts2 prefix when forwarding
    rewrite ^/tts2/(.*) /$1 break;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (for /tts2/ws endpoint)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Streaming support - disable buffering for real-time audio
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # Timeouts for long TTS generation
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Large audio file uploads (for voice cloning)
    client_max_body_size 50m;
}
	location /tts3/ {
    # Proxy to local TTS server (via SSH tunnel on port 8888)
    proxy_pass http://127.0.0.1:6767/;

    # Properly strip /tts2 prefix when forwarding
    rewrite ^/tts3/(.*) /$1 break;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (for /tts2/ws endpoint)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Streaming support - disable buffering for real-time audio
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # Timeouts for long TTS generation
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Large audio file uploads (for voice cloning)
    client_max_body_size 50m;
}
	# Text2Image API
    location /t2i/ {
        # Strip /t2i prefix when forwarding
        rewrite ^/t2i/(.*) /$1 break;
        
        proxy_pass http://127.0.0.1:9998/;
        proxy_http_version 1.1;
        
        # Connection settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeout settings for long-running image generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # Buffer settings for large base64 image responses
        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 64k;
        
        # Max body size for requests
        client_max_body_size 30M;
    }
    location /sr/ {
    proxy_pass http://127.0.0.1:9997/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Increase timeouts for large image processing
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Increase body size for image uploads (adjust as needed)
    client_max_body_size 50M;

    # WebSocket support (if needed for future streaming)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Disable buffering for streaming responses
    proxy_buffering off;
    }

    # ============================================
    # VideoGen - Rowan Video Generation (port 52026 tunneled)
    # ============================================
    location /videogen/ {
        alias /mnt/data/Yanlai/videogen/static/;
        index index.html;
        try_files $uri $uri/ /videogen/index.html;
    }
    
    location /videogen/api/ {
        rewrite ^/videogen/api/(.*) /api/$1 break;
        
        proxy_pass http://127.0.0.1:52026;
        proxy_http_version 1.1;
        
        # WebSocket support for progress updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Long timeouts for video generation
        proxy_connect_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # Large file uploads for images
        client_max_body_size 100M;
        
        # Disable buffering for streaming
        proxy_buffering off;
        
        # CORS headers
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
    }
    
    location /videogen/health {
        proxy_pass http://127.0.0.1:52026/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /videogen/outputs/ {
        proxy_pass http://127.0.0.1:52026/outputs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # ============================================
    # Image3D - TripoSG + MV-Adapter (port 62026 tunneled)
    # ============================================
    location /Image3D/ {
        alias /mnt/data/Yanlai/Image3D/;
        index index.html;
    }

    location ~ ^/Image3D/(upload|generate_shape|apply_texture|download|convert|queue_status) {
        rewrite ^/Image3D/(.*)$ /$1 break;
        
        proxy_pass http://127.0.0.1:62026;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Generous timeouts for generation
        proxy_connect_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        client_max_body_size 50M;
    }

    # SSE endpoint for real-time progress updates
    location ~ ^/Image3D/events/ {
        rewrite ^/Image3D/(.*)$ /$1 break;
        
        proxy_pass http://127.0.0.1:62026;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE-specific settings
        add_header X-Accel-Buffering no;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # ============================================
    # TrainWeb - Training Monitor (port 72026 tunneled)
    # ============================================
    location /trainweb/ {
        alias /mnt/data/Yanlai/TrainWebFrontend/;
        index index.html;
        try_files $uri $uri/ /trainweb/index.html;
    }
    
    location /trainweb/api/ {
        rewrite ^/trainweb/api/(.*) /$1 break;
        
        proxy_pass http://127.0.0.1:32026;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
