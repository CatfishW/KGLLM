ablations:
  frozen_encoder:
    model:
      freeze_encoder: true
    training:
      learning_rate: 5e-4
  no_hop_aux:
    hop_auxiliary:
      enabled: false
      weight: 0.0
  no_late_interaction:
    late_interaction:
      temperature: 1.0
checkpointing:
  mode: max
  monitor: val/acc
  save_last: true
  save_top_k: 3
data:
  dataset: combined
  max_candidates: 100
  num_negatives: 99
  num_workers: 4
  test_paths:
  - /data/Yanlai/KGLLM/Data/preprocessed_paths/webqsp_test.parquet
  - /data/Yanlai/KGLLM/Data/preprocessed_paths/cwq_test.parquet
  train_paths:
  - /data/Yanlai/KGLLM/Data/preprocessed_paths/webqsp_train.parquet
  - /data/Yanlai/KGLLM/Data/preprocessed_paths/cwq_train.parquet
  val_paths:
  - /data/Yanlai/KGLLM/Data/preprocessed_paths/webqsp_val.parquet
  - /data/Yanlai/KGLLM/Data/preprocessed_paths/cwq_val.parquet
hop_auxiliary:
  cumulative: true
  enabled: true
  loss_weights:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.25
  temperature: 1.0
  weight: 0.3
late_interaction:
  learnable_temperature: false
  normalize: true
  temperature: 0.02
logging:
  log_every_n_steps: 50
  val_check_interval: 0.25
loss:
  margin: 1.0
  margin_weight: 0.1
  primary_temperature: 0.05
model:
  dropout: 0.1
  encoder_name: BAAI/bge-base-en-v1.5
  freeze_encoder: false
  hidden_dim: 768
  max_hops: 6
  max_path_length: 64
  max_question_length: 128
  name: HopColBERTReranker
  projection_dim: 128
training:
  batch_size: 8
  gradient_accumulation_steps: 4
  gradient_clip_val: 1.0
  learning_rate: 2.0e-05
  max_epochs: 300
  max_steps: -1
  precision: 16-mixed
  warmup_ratio: 0.1
  weight_decay: 0.01
